<!DOCTYPE html>
<html lang="en">
<head></head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar categoría</title>
</head>
<body>
    <h1>Eliminar categoría</h1>
    <p>¿Estás seguro de que quieres eliminar la categoría "{{ categoria.nombre }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'categoria_list' %}">Cancelar</a>
    </form>
</body>
</html>
