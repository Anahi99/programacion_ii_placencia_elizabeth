{% extends 'catequesis/base.html' %}

{% block titulo %}Registro{% endblock %}

{% block contenido %}
    <h2>Crear cuenta</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tiene cuenta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
